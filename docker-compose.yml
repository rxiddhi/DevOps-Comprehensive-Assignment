services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: assignment_app
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/usersdb
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: assignment_mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
